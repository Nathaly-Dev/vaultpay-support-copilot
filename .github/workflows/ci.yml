name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o CI só lê o repositório.
permissions:
  contents: read

# Um push novo cancela a execução antiga da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, testes e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: vaultpay
          POSTGRES_PASSWORD: ci_throwaway_password # banco descartável do CI, não é segredo real
          POSTGRES_DB: vaultpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultpay -d vaultpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: vaultpay
      POSTGRES_PASSWORD: ci_throwaway_password
      POSTGRES_DB: vaultpay_test
      PGPASSWORD: ci_throwaway_password
    steps:
      # Actions fixadas por SHA (o comentário diz a versão) para o código não mudar por baixo de nós.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Só o núcleo: os testes usam embeddings falsos, então o PyTorch (e seu lockfile
      # específico de Windows) não entra no CI.
      - name: Instalar dependências (com hashes)
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Formatação
        run: ruff format --check src tests

      - name: Aplicar o schema
        run: psql -h localhost -U vaultpay -d vaultpay_test -v ON_ERROR_STOP=1 -f db/migrations/001_initial_schema.sql

      - name: Teste de fumaça do schema
        run: psql -h localhost -U vaultpay -d vaultpay_test -v ON_ERROR_STOP=1 -f db/smoke_test.sql

      - name: Testes
        run: python -m pytest -q -rs

      - name: Auditoria de vulnerabilidades (núcleo e ML)
        run: |
          pip-audit -r requirements.txt --disable-pip --no-deps
          pip-audit -r requirements-ml.txt --disable-pip --no-deps

  secrets:
    name: Busca de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo: segredo apagado num commit antigo também conta
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
